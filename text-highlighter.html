<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Text Highlighter</title>
	<style>
		.highlight {
			background-color: yellow;
			padding: 10px;
			border-left: 4px solid orange;
		}
	</style>
</head>
<body>

	<h1 id="page-title">Text Highlighter</h1>

	<p class="paragraph">This is the first paragraph. It introduces the topic.</p>
	<p class="paragraph">Here is the second paragraph with different content.</p>
	<p class="paragraph">The third paragraph contains some example text to highlight.</p>
	<p class="paragraph">Finally, the fourth paragraph completes the sample content.</p>

	<button id="highlight-btn">Highlight All</button>
	<button id="clear-btn">Clear Highlights</button>
	<button id="toggle-btn">Toggle First Paragraph</button>

	<script defer src="script.js"></script>

</body>
</html>
