<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Color Changer Lab</title>
    <style>
        .box {
            width: 200px;
            height: 200px;
            background-color: lightgray;
            border: 2px solid black;
            margin: 10px;
            padding: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- Heading -->
    <h1 id="main-heading">Color Changer Lab</h1>

    <!-- Boxes -->
    <div class="box" id="box1">Box 1</div>
    <div class="box" id="box2">Box 2</div>
    <div class="box" id="box3">Box 3</div>

    <br><br>

    <!-- Color Buttons -->
    <button id="btn-red">Make Red</button>
    <button id="btn-blue">Make Blue</button>
    <button id="btn-green">Make Green</button>

    <br><br>

    <!-- Reset Button -->
    <button id="reset-btn">Reset All</button>

    <script defer src="script.js"></script>
</body>
</html>
